<script>
(()=>{
const $=id=>document.getElementById(id);
const {S,clamp,lerp,eo,eio}=M;
const W=1920,H=1080,T=34.5;
const eoo=x=>1-Math.pow(1-clamp(x),4);
/* piecewise keys [[t,v,ease?],…] */
const K=(keys,ease=eio)=>t=>{
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1]; if(t<b[0]){const u=(t-a[0])/(b[0]-a[0]); return a[1]+(b[1]-a[1])*(b[2]||ease)(u);}}
  return keys[keys.length-1][1];
};
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,u)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*clamp(u))).join(',')})`;};
const vis=(el,on)=>{el.style.display=on?'block':'none';return on;};
const blurOp=(el,b,o=1)=>{el.style.filter=b>0.05?`blur(${b.toFixed(2)}px)`:'none';el.style.opacity=o.toFixed(3);};

/* ---------- word-by-word lines ---------- */
const GREY='#b4b4b4';
const mkLine=(el,words)=>{ // words: [text,t0,color,dy]
  el.innerHTML=words.map(w=>`<span class="w">${w[0]}</span>`).join('');
  const sp=[...el.children];
  return {sp, words, upd(t,xo){
    sp.forEach((s,i)=>{const [_,t0,col,dy=0]=words[i];
      const a=eoo((t-t0)/0.24), c=eo((t-t0-0.06)/0.32);
      s.style.opacity=a.toFixed(3); s.style.color=mix(GREY,col,c);
      s.style.filter=a<0.98?`blur(${((1-a)*11).toFixed(2)}px)`:'none';
      const x=xo?xo(i,t):0;
      s.style.transform=`translate(${x.toFixed(2)}px,${((1-a)*16+dy).toFixed(2)}px)`;});
  }};
};
const center=(el,cx,cy)=>{const r=el.getBoundingClientRect();el.style.left=(cx-el.offsetWidth/2)+'px';el.style.top=(cy-el.offsetHeight/2)+'px';};

/* ---------- lime blobs: harmonic outlines, blurred ---------- */
const blobPath=(cx,cy,r,t,s)=>{
  const N=10,pts=[];
  for(let i=0;i<N;i++){const th=i/N*Math.PI*2;
    const k=1+0.16*Math.sin(2*th+s*1.7+0.55*t)+0.10*Math.sin(3*th+s*2.9-0.42*t)+0.06*Math.sin(5*th+s*4.1+0.9*t);
    pts.push([cx+Math.cos(th)*r*k*1.12,cy+Math.sin(th)*r*k]);}
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<N;i++){const p0=pts[(i-1+N)%N],p1=pts[i],p2=pts[(i+1)%N],p3=pts[(i+2)%N];
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  return d+'Z';
};
const mkBlobs=(svg,cfg)=>{ // cfg: [[t,[[x,y,r],…]],…]; slots morph between configurations
  const n=Math.max(...cfg.map(c=>c[1].length));
  svg.setAttribute('viewBox','-200 -200 2320 1480');
  svg.innerHTML=`<defs><radialGradient id="bg${svg.id}" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="#b4e01a"/><stop offset=".7" stop-color="#9ccf05"/><stop offset="1" stop-color="#8cc400"/></radialGradient></defs>`+
    Array.from({length:n},()=>`<path fill="url(#bg${svg.id})"/>`).join('');
  const paths=[...svg.querySelectorAll('path')];
  const tr=Array.from({length:n},(_,i)=>[0,1,2].map(k=>{
    const keys=[]; cfg.forEach(([tt,bl],j)=>{const v=(bl[i]||[960,1500,0])[k]; if(j===0) keys.push([tt,v]); else {keys.push([tt,keys[keys.length-1][1]]); keys.push([tt+0.7,v]);}});
    return K(keys,eio);}));
  return t=>paths.forEach((p,i)=>{const [x,y,r]=tr[i].map(f=>f(t)); const dx=40*Math.sin(0.5*t+i*2.1), dy=30*Math.cos(0.43*t+i*1.3);
    p.setAttribute('d',r<2?'':blobPath(x+dx,y+dy,r,t,i+1));});
